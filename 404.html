<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#152c23">
  <title>Page not found | Prestige Destination Tours</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#152c23;color:#fff5e4;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
    .error-page{min-height:100svh;display:grid;place-items:center;padding:28px}
    .panel{width:min(100%,680px);border-block:1px solid #dfb37366;padding:clamp(32px,7vw,80px) 0}
    .brand{margin:0;color:#f1c98d;font-size:.76rem;font-weight:750;letter-spacing:.19em;text-transform:uppercase}
    .code{display:block;margin:28px 0 4px;color:#f1c98d;font-size:1rem;font-weight:750;letter-spacing:.18em}
    h1{font:500 clamp(3rem,9vw,6rem)/1.02 Georgia,serif;letter-spacing:-.05em;margin:0 0 20px}
    .description{margin:0;color:#ecdfc9;line-height:1.6}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
    .actions a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 18px;border:1px solid #dfb373;color:#f1c98d;font-size:.9rem;font-weight:700;text-decoration:none}
    .actions .primary{background:#dfb373;color:#23180b}
    .actions a:hover{background:#f8dbaf;color:#23180b}
    .actions a:focus-visible{outline:2px solid #fff5e4;outline-offset:4px}
    @media(max-width:370px){.actions a{width:100%}}
  </style>
</head>
<body>
  <main class="error-page">
    <section class="panel" aria-labelledby="error-title">
      <p class="brand">Prestige Destination Tours</p>
      <span class="code">404</span>
      <h1 id="error-title">Page not found</h1>
      <p class="description">The page you’re looking for may have moved.</p>
      <div class="actions">
        <a class="primary" href="https://futurifydesigns.github.io/Prestige-Destination-Tours/">Back to home</a>
        <a href="https://futurifydesigns.github.io/Prestige-Destination-Tours/plan/?mode=booking">Plan your trip</a>
      </div>
    </section>
  </main>
</body>
</html>
